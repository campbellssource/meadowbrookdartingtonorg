title: Replace the bins with smarter ones
category: project
status: open
order: 38
scope: major
summary: >-
  The black plastic bins around the park and play areas are tired and easy to
  miss. Swap them for better-looking bins with separate recycling and general
  waste sections, plus a panel for DRA signs and notices.
