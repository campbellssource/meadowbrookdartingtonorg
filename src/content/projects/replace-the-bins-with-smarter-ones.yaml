helpNeeded:
  - Ideas and designs for bins that fit the space - timber-clad could look great
  - Split recycling and non-recycling sections in each bin
  - A space on each bin for signs about the DRA
  - Landworks may be able to help build them - someone to ask them
  - Funding for materials, and agreement on who empties the recycling
