heroHeading: "Welcome to Meadowbrook"
heroSubtitle: "Meadowbrook is managed by The Dartington Recreation Association, a charity run by volunteers who manage the Meadowbrook building and surrounding facilities on behalf of the Dartington community."
aboutPreview:
  - type: paragraph
    children:
      - text: "These 10 acres of land were generously bequeathed to the village by the Elmhirsts and the Dartington Hall Trust in 1962. The land is now managed by the Dartington Recreation Association (DRA), a charity run by local volunteers, under a lease that next comes up for renewal in 2118!"
partnersIntro: "Dartington Hall Trust, Bidwell Brook School, Sport England, and Lifeworks."
