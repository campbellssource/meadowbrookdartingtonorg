shortDescription: A versatile 75 m² studio and events space with high vaulted ceiling in Dartington, near Totnes. Ideal for yoga, martial arts, meetings and events.
image: /images/facilities/large-room/large-room-1.jpeg
facilityType:
  discriminant: bookable
