    amenities:
      - High vaulted ceiling
      - Full-length wall-mounted barre - ideal for ballet, contemporary dance and yoga warm-ups
      - Parquet floor section (4.3m × 4.7m) - warm bare-wood surface for movement and mat work
      - Full clear floor 11m × 6.85m (approx. 75 m²) when chairs are stored
