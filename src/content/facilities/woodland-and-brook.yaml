name: "Woodland and Brook"
shortDescription: "Nature walks and wildlife"
facilityType:
  discriminant: generic
  value:
    intro:
      - type: paragraph
        children:
          - text: "Meadowbrook Park is 10 acres of land in the heart of Dartington. It includes recreational buildings, a bike track, woodlands, a section of the Bidwell Brook and playing fields (Dorothy Elmhirst Playing Field)."
      - type: paragraph
        children:
          - text: "The land is owned by Dartington Hall Trust on long lease to Dartington Recreation Association (DRA)."
    body:
      - type: heading
        level: 2
        children:
          - text: "Green Vision for Meadowbrook Park"
      - type: paragraph
        children:
          - text: "Earthjump CIC in collaboration with the DRA has worked with the wider Meadowbrook community to develop a Green Vision for the park, aiming to:"
      - type: unordered-list
        children:
          - type: list-item
            children:
              - type: list-item-content
                children:
                  - text: "Maintain and enhance the important habitats and species"
          - type: list-item
            children:
              - type: list-item-content
                children:
                  - text: "Provide high quality sites for education, recreation and sport"
          - type: list-item
            children:
              - type: list-item-content
                children:
                  - text: "Maintain and enhance public enjoyment of the green spaces"
          - type: list-item
            children:
              - type: list-item-content
                children:
                  - text: "Conserve a much valued green space in the heart of Dartington"
      - type: heading
        level: 3
        children:
          - text: "Wild meadow areas"
      - type: paragraph
        children:
          - text: "The most established meadow is in the Rabbit Triangle in the west of the park — a damp site where grassland has existed since at least 1946. Notable species include Southern Marsh Orchids and Common Spotted Orchids."
      - type: heading
        level: 3
        children:
          - text: "Semi-natural broadleaved woodland"
      - type: paragraph
        children:
          - text: "Much of the woodland in the park has grown since 1946, where trees existed mainly in a narrow strip along Bidwell Brook."
      - type: heading
        level: 3
        children:
          - text: "Wildlife"
      - type: paragraph
        children:
          - text: "The park supports a rich variety of wildlife. Reptiles and amphibians include slow worms, grass snakes and common toads. Birds include greater spotted woodpeckers, song thrush, and kingfishers along the brook. Mammals include dormice, hedgehogs, stoats, bank voles and wood mice. A variety of bat species have been recorded, including greater and lesser horseshoe bats, pipistrelles and barbastelle."
      - type: heading
        level: 3
        children:
          - text: "Young trees in Dorothy Elmhirst Field"
      - type: paragraph
        children:
          - text: "In November 2019 pupils from Dartington Primary and the Wave Academy planted saplings of rowan, wild cherry, field maple and silver birch, donated by the Woodland Trust. These trees are now cared for by volunteers from the local community."
