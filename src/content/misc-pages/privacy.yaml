title: "Privacy Policy"
body:
  - type: paragraph
    children:
      - text: "This privacy policy explains how Dartington Recreation Association (DRA), the charity behind Meadowbrook, collects and uses personal information."
  - type: heading
    level: 2
    children:
      - text: "Who we are"
  - type: paragraph
    children:
      - text: "Dartington Recreation Association is a registered charity (Charity number 1168817) based at Meadowbrook, Dartington, Devon."
  - type: heading
    level: 2
    children:
      - text: "What information we collect"
  - type: paragraph
    children:
      - text: "We collect personal information you provide when you contact us, subscribe to our mailing list, make a booking, or apply to volunteer or become a trustee. This may include your name, email address, and other contact details."
  - type: heading
    level: 2
    children:
      - text: "How we use your information"
  - type: paragraph
    children:
      - text: "We use your information to respond to enquiries, send updates you have subscribed to, and administer bookings and memberships. We will not share your information with third parties without your consent, except as required by law."
  - type: heading
    level: 2
    children:
      - text: "Contact"
  - type: paragraph
    children:
      - text: "If you have any questions about this policy or wish to have your data removed, please contact us."
