eyebrow: Look after Meadowbrook
heading: Projects & Ideas
intro: >-
  Meadowbrook is looked after by the people who use it. This is our shared list
  of things we'd love to do - from quick jobs at the next workday to bigger
  projects we're working towards together. Have a look, and if something
  speaks to you, put your hand up.
howItWorks: >-
  Anyone can get involved. Offer a few hours at a workday, lend a skill or some
  materials, or become the named lead for a job so others can rally around you.
  Local businesses are very welcome to donate time or materials - we'll happily
  say thank you here when the job is done.
contactEmail: volunteer@meadowbrookdartington.org
ideasHeading: Got an idea?
ideasBody: >-
  However half-formed, we'd love to hear it. A better use for a room, something
  the kids would enjoy, a small change that would make a big difference - send
  it our way and we'll add the good ones to the list.
ideasButtonLabel: Share an idea
ideasEmail: contact@meadowbrookdartington.org
