title: "About"
seoDescription: "About Meadowbrook and the Dartington Recreation Association (DRA), a charity run by local volunteers managing 10 acres in the heart of Dartington."
intro:
  - type: paragraph
    children:
      - text: "These 10 acres of land were generously bequeathed to the village by the Elmhirsts and the Dartington Hall Trust in 1962. The land is now managed by the Dartington Recreation Association (DRA), a charity run by local volunteers, under a lease that next comes up for renewal in 2118!"
  - type: paragraph
    children:
      - text: "The Dartington Recreation Association is a registered charity (Charity number 1168817) run by volunteers. New members and helpers are always welcome. Please contact us if you would like to get involved."
body:
  - type: heading
    level: 2
    children:
      - text: "Roles"
  - type: paragraph
    children:
      - text: "The DRA has approximately 15 trustees. We have the typical charity roles: Chair, Treasurer, and Secretary, plus representatives from neighbouring organisations including Dartington Primary School, The Wave, Bidwell Brook School, and Lifeworks, as well as representatives from the clubs who use the facilities."
  - type: paragraph
    children:
      - text: "Trustees stand down at each Annual General Meeting (AGM), and new trustees are nominated. Meetings are open to the public; if you would like to attend, please "
      - type: link
        href: "/subscribe-to-updates"
        children:
          - text: "subscribe to the mailing list"
      - text: "."
  - type: paragraph
    children:
      - text: "A "
      - type: link
        href: "/be-a-trustee"
        children:
          - text: "trustee application form"
      - text: " is available for anyone interested in becoming a trustee. These forms are circulated to trustees in the lead-up to the AGM. A good way to start is by volunteering."
  - type: heading
    level: 2
    children:
      - text: "Volunteers"
  - type: paragraph
    children:
      - text: "A pool of volunteers keep the DRA going. We need help with both ad-hoc events and day-to-day activities. Many volunteers are former trustees or are on the path to becoming trustees. If you are interested, please "
      - type: link
        href: "/volunteer"
        children:
          - text: "subscribe to the mailing list and let us know your areas of interest"
      - text: "."
  - type: heading
    level: 2
    children:
      - text: "Working Groups"
  - type: paragraph
    children:
      - text: "Currently we have several key working groups, composed of individuals who report to the trustees but also operate with autonomy:"
  - type: unordered-list
    children:
      - type: list-item
        children:
          - type: list-item-content
            children:
              - text: "Pool Group: working towards the revival of the Dartington swimming pool"
      - type: list-item
        children:
          - type: list-item-content
            children:
              - text: "Building Group: improving the existing building and scoping out the next phase of development"
      - type: list-item
        children:
          - type: list-item-content
            children:
              - text: "Management Group: responsible for the day-to-day management of the organisation and facilities"
