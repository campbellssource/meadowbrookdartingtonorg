title: "Energy Hub"
seoDescription: "Meadowbrook and neighbouring organisations are working together to create shared sustainable energy infrastructure for the Dartington community."
intro:
  - type: paragraph
    children:
      - text: "Meadowbrook and the neighbouring organisations are working together to create shared energy infrastructure."
  - type: paragraph
    children:
      - text: "Thanks to everyone who completed the survey — we received 198 responses. Overall 90% either Love or Like the ideas proposed. Making use of Solar PV was the highest rated priority. 55 locals have also said they are keen to get involved."
body:
  - type: paragraph
    children:
      - text: "We have won 100% grant funding from Devon County Council's Green Impact Fund for 80 solar panels on the community's Pavilion roof. The Green Impact Fund is funded by the Ministry of Housing, Communities & Local Government (MHCLG) as part of the Devon and Torbay Devolution Deal and managed by Devon County Council."
  - type: heading
    level: 3
    children:
      - text: "Need to cut energy costs? Need to replace gas heating to become Net Zero?"
  - type: paragraph
    children:
      - text: "Stage 1 feasibility is looking at the potential for us to use solar electricity and ground source heating networks to offer sustainable energy supplies for our community facilities, schools and other local services. This work is funded by the Department for Energy Security and Net Zero and supported by the Southwest Net Zero Hub."
  - type: heading
    level: 3
    children:
      - text: "It Starts with All of Us"
  - type: paragraph
    children:
      - text: "This idea came from community trustees' meetings, talking about challenges we're all facing around energy, environmental protection and longer-term sustainability. We are all facing high energy and resource costs as well as the challenges of climate impacts. At our Energy Day (2023), we identified key challenges and opportunities:"
  - type: unordered-list
    children:
      - type: list-item
        children:
          - type: list-item-content
            children:
              - text: "More energy effective buildings and facilities"
      - type: list-item
        children:
          - type: list-item-content
            children:
              - text: "Need for practical and deliverable solutions"
      - type: list-item
        children:
          - type: list-item-content
            children:
              - text: "Helping save the planet whilst enhancing our community purposes"
  - type: heading
    level: 3
    children:
      - text: "Let's Transition Together"
  - type: paragraph
    children:
      - text: "Our plan to help is simple:"
  - type: unordered-list
    children:
      - type: list-item
        children:
          - type: list-item-content
            children:
              - text: "Engage our community user stakeholders on this together"
      - type: list-item
        children:
          - type: list-item-content
            children:
              - text: "Better understand our (future) energy consumption and opportunities to reduce"
      - type: list-item
        children:
          - type: list-item-content
            children:
              - text: "Scope out opportunities for local community energy generation and networks"
      - type: list-item
        children:
          - type: list-item-content
            children:
              - text: "Co-develop a set of sustainable financing and energy supply proposals"
  - type: heading
    level: 3
    children:
      - text: "Imagine us proud of the outcomes we're achieving"
  - type: unordered-list
    children:
      - type: list-item
        children:
          - type: list-item-content
            children:
              - text: "More inclusive community services and facilities"
      - type: list-item
        children:
          - type: list-item-content
            children:
              - text: "Better energy security — lower consumption, costs and carbon"
      - type: list-item
        children:
          - type: list-item-content
            children:
              - text: "Inspiring participation and educational engagement"
      - type: list-item
        children:
          - type: list-item-content
            children:
              - text: "Funding local community facilities and services, rather than profits going elsewhere"
  - type: heading
    level: 2
    children:
      - text: "Get involved"
  - type: paragraph
    children:
      - text: "We'd love to chat to see if there's a fit with your site's energy requirements. Email "
      - type: link
        href: "mailto:energyhub@meadowbrookdartington.org"
        children:
          - text: "energyhub@meadowbrookdartington.org"
      - text: " if you're interested to find out more."
