<!doctype html>
<meta charset="utf-8">
<title>Type — zone display fonts (2/2)</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 28px; }
  .head { font-size: 11px; color: var(--ink-mute); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 14px; }
  .row { display: grid; grid-template-columns: 100px 1fr 140px; gap: 18px; align-items: baseline; padding: 8px 0; }
  .lab { font-size: 11px; color: var(--ink-mute); letter-spacing: 0.04em; text-transform: uppercase; }
  .meta { font-family: ui-monospace, monospace; font-size: 10px; color: var(--ink-mute); text-align: right; }
  .meta .ok { color: var(--green-dark); }
  .specimen { color: var(--ink); font-size: 38px; line-height: 1; }
  .playground { font-family: "Nunito", sans-serif; font-weight: 900; letter-spacing: -0.02em; }
  .studio { font-family: "Josefin Sans", sans-serif; font-weight: 300; letter-spacing: 0.04em; font-size: 36px; }
  .lounge { font-family: "Righteous", sans-serif; font-size: 34px; }
  .pool { font-family: "Rexton", sans-serif; font-weight: 800; }
  .snooker { font-family: "Billiard", serif; font-size: 44px; }
</style>
<div class="card">
  <div class="head">Zone display fonts — pt 2</div>
  <div class="row"><span class="lab">Playground</span><span class="specimen playground">Swing high!</span><span class="meta">Nunito 900</span></div>
  <div class="row"><span class="lab">Studio</span><span class="specimen studio">Breathe out</span><span class="meta">Josefin Sans</span></div>
  <div class="row"><span class="lab">Lounge</span><span class="specimen lounge">Open till late</span><span class="meta">Righteous</span></div>
  <div class="row"><span class="lab">Pool</span><span class="specimen pool">Splash</span><span class="meta"><span class="ok">✓</span> Rexton (brand file)</span></div>
  <div class="row"><span class="lab">Snooker</span><span class="specimen snooker">Snooker</span><span class="meta"><span class="ok">✓</span> Billiard (brand file)</span></div>
</div>
