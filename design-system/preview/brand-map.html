<!doctype html>
<meta charset="utf-8">
<title>Site map</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 0; background: #FBF0DF; display: grid; grid-template-columns: 1.4fr 1fr; gap: 0; }
  .map-frame { background: var(--bone); display: flex; align-items: center; justify-content: center; padding: 12px; }
  .map-frame img { width: 100%; height: auto; display: block; }
  .meta { padding: 28px 32px; align-self: center; }
  .eyebrow { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-mute); font-weight: 500; margin-bottom: 8px; }
  h3 { font-family: "Plus Jakarta Sans"; font-size: 22px; font-weight: 600; margin: 0 0 8px; color: var(--ink); }
  p { font-size: 14px; color: var(--ink-soft); line-height: 1.55; margin: 0; max-width: 280px; }
</style>
<div class="card">
  <div class="map-frame"><img src="../assets/illustrations/map.png" alt=""></div>
  <div class="meta">
    <div class="eyebrow">Brand asset</div>
    <h3>The hand-drawn map</h3>
    <p>Our one big illustration. Always shown whole - never zoomed into or cropped. Hand-drawn, slightly imperfect - keep it that way. Never re-trace as a clean vector.</p>
  </div>
</div>
