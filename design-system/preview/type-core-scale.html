<!doctype html>
<meta charset="utf-8">
<title>Type — core scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px 32px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .head h3 { font-size: 14px; font-weight: 600; margin: 0; color: var(--ink); }
  .head .sub { font-size: 11px; color: var(--ink-mute); letter-spacing: 0.05em; text-transform: uppercase; }
  .row { display: grid; grid-template-columns: 110px 1fr 70px; gap: 16px; align-items: baseline; padding: 6px 0; }
  .lab { font-size: 11px; color: var(--ink-mute); letter-spacing: 0.04em; text-transform: uppercase; }
  .specimen { color: var(--ink); font-family: "Plus Jakarta Sans", sans-serif; }
  .meta { font-family: ui-monospace, monospace; font-size: 11px; color: var(--ink-mute); text-align: right; }
  .display   { font-size: 44px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; }
  .headline  { font-size: 26px; font-weight: 500; line-height: 1.15; letter-spacing: -0.01em; }
  .body      { font-size: 16px; font-weight: 400; line-height: 1.5; }
  .lbl       { font-size: 12px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }
</style>
<div class="card">
  <div class="head">
    <h3>Plus Jakarta Sans — the only body & UI font</h3>
    <span class="sub">All zones</span>
  </div>
  <div class="row"><span class="lab">Display</span><span class="specimen display">Stay too late</span><span class="meta">56/700</span></div>
  <div class="row"><span class="lab">Headline</span><span class="specimen headline">Cross the bridge, find the fields</span><span class="meta">32/500</span></div>
  <div class="row"><span class="lab">Body</span><span class="specimen body">A place to swim, kick around, eat pizza and stay too late.</span><span class="meta">16/400</span></div>
  <div class="row"><span class="lab">Label</span><span class="specimen lbl">Saturday · free entry</span><span class="meta">12/500</span></div>
</div>
