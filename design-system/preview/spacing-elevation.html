<!doctype html>
<meta charset="utf-8">
<title>Elevation</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 26px 28px; background: var(--paper); }
  .head { font-size: 11px; color: var(--ink-mute); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 18px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .step { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .swatch { width: 100%; height: 70px; background: #FFFBF2; border-radius: var(--r-md); }
  .swatch.tonal { background: var(--paper-deep); }
  .lab { font-size: 12px; color: var(--ink); font-weight: 600; }
  .desc { font-size: 11px; color: var(--ink-mute); line-height: 1.4; }
</style>
<div class="card">
  <div class="head">Elevation - tonal layering first, shadows sparingly</div>
  <div class="row">
    <div class="step">
      <div class="swatch tonal"></div>
      <span class="lab">Tonal</span>
      <span class="desc">Preferred. Bg shift only.</span>
    </div>
    <div class="step">
      <div class="swatch" style="box-shadow: 0 2px 6px rgba(40,35,32,0.08)"></div>
      <span class="lab">shadow-press</span>
      <span class="desc">0 2px 6px / 8%</span>
    </div>
    <div class="step">
      <div class="swatch" style="box-shadow: 0 20px 40px rgba(40,35,32,0.06)"></div>
      <span class="lab">shadow-float</span>
      <span class="desc">0 20px 40px / 6%</span>
    </div>
    <div class="step">
      <div class="swatch" style="box-shadow: 0 30px 80px -20px rgba(40,35,32,0.18)"></div>
      <span class="lab">shadow-pop</span>
      <span class="desc">Modals, lifted CTA</span>
    </div>
  </div>
</div>
