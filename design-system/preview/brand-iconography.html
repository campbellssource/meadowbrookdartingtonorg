<!doctype html>
<meta charset="utf-8">
<title>Iconography</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 28px; background: var(--paper); }
  .head { font-size: 11px; color: var(--ink-mute); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .col h4 { font-family: "Plus Jakarta Sans"; font-size: 13px; font-weight: 600; margin: 0 0 12px; color: var(--ink); }
  .marks { display: flex; align-items: center; gap: 18px; }
  .marks img { height: 56px; width: auto; }
  .lucide-row { display: flex; gap: 18px; align-items: center; color: var(--ink); }
  .lucide-row svg { display: block; }
  .desc { font-size: 12px; color: var(--ink-mute); margin-top: 8px; line-height: 1.45; }
</style>
<div class="card">
  <div class="head">Iconography — custom marks per zone + Lucide for UI</div>
  <div class="grid">
    <div class="col">
      <h4>Custom marks</h4>
      <div class="marks">
        <img src="../assets/logos/hand.png" alt="">
        <img src="../assets/illustrations/pool-icon.png" alt="" style="background:#FBF0DF; padding:6px; border-radius:8px;">
        <img src="../assets/illustrations/playing-fields-motif.png" alt="" style="height:46px;">
        <img src="../assets/logos/bike-track-badge.png" alt="">
      </div>
      <div class="desc">PNG / SVG, per zone. Never re-traced.</div>
    </div>
    <div class="col">
      <h4>Lucide — UI glyphs, stroke 1.75, currentColor</h4>
      <div class="lucide-row">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>
      </div>
      <div class="desc">No emoji as iconography. No unicode arrows in buttons.</div>
    </div>
  </div>
</div>
