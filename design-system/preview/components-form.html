<!doctype html>
<meta charset="utf-8">
<title>Form input</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 26px 30px; background: var(--paper); }
  .head { font-size: 11px; color: var(--ink-mute); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 16px; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 560px; }
  label { display: flex; flex-direction: column; gap: 6px; font-family: "Plus Jakarta Sans"; }
  label span { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-mute); font-weight: 600; }
  input, select {
    font-family: inherit;
    font-size: 15px;
    padding: 12px 14px;
    background: #FFFFFF;
    color: var(--ink);
    border: 1px solid rgba(40, 35, 32, 0.18);
    border-top-color: rgba(40, 35, 32, 0.28);    /* a touch deeper top edge */
    border-radius: 6px;
    box-shadow: inset 0 2px 3px rgba(40, 35, 32, 0.08);
    outline: none;
    transition: border-color 140ms, box-shadow 140ms;
  }
  input:focus, select:focus {
    border-color: var(--green);
    box-shadow: inset 0 2px 3px rgba(40, 35, 32, 0.10),
                0 0 0 3px rgba(116, 169, 83, 0.18);
  }
  .full { grid-column: 1 / -1; }
  .submit { font-family: "Plus Jakarta Sans"; font-weight: 600; padding: 12px 22px; border-radius: 6px; background: #28201A; color: #fff; border: 0; grid-column: 1 / -1; justify-self: start; cursor: pointer; box-shadow: 0 3px 0 0 #110A05, inset 0 1px 0 0 rgba(255,255,255,0.18); transition: transform 90ms ease-out, box-shadow 90ms ease-out; }
  .submit:active { transform: translateY(3px); box-shadow: 0 0 0 0 #110A05, inset 0 1px 0 0 rgba(255,255,255,0.12); }
</style>
<div class="card">
  <div class="head">Forms — hairline border, inner shadow on inputs · chunky 3D submit</div>
  <form>
    <label><span>Your name</span><input value="Ada Bishop"></label>
    <label><span>Date</span><input value="24 June 2026"></label>
    <label class="full"><span>What's it for?</span><select><option>Birthday party</option><option>Yoga class</option><option>Snooker game</option></select></label>
    <button type="button" class="submit">Send enquiry</button>
  </form>
</div>
