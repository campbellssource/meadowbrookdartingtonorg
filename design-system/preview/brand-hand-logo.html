<!doctype html>
<meta charset="utf-8">
<title>Hand logo</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { background: var(--paper); }
  .card { display: flex; align-items: center; gap: 32px; padding: 28px 36px; }
  .hand-wrap { background: var(--paper-deep); border-radius: var(--r-lg); padding: 18px 22px; flex: none; }
  .hand-wrap img { display: block; height: 110px; width: auto; }
  .meta { line-height: 1.45; }
  .lockup { font-family: "Lobster", cursive; font-size: 38px; color: var(--ink); line-height: 1; margin-bottom: 8px; }
  .sub { font-size: 13px; color: var(--ink-soft); max-width: 380px; }
  .pair { display: flex; gap: 18px; margin-top: 14px; }
  .pair > div { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-mute); }
  .pair b { display: block; color: var(--ink); font-size: 13px; letter-spacing: 0; text-transform: none; font-weight: 600; margin-top: 2px; }
</style>
<div class="card">
  <div class="hand-wrap"><img src="../assets/logos/hand.png" alt=""></div>
  <div class="meta">
    <div class="lockup">the DRA</div>
    <div class="sub">Bright, sunny, optimistic, accessible. Hand = Meadowbrook + the DRA. Wordmark (Lobster) only when speaking primarily about the charity.</div>
    <div class="pair">
      <div>Mark<b>Hand</b></div>
      <div>Wordmark font<b>Lobster</b></div>
      <div>Use as<b>SVG / PNG</b></div>
    </div>
  </div>
</div>
