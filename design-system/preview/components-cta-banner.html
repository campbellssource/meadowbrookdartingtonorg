<!doctype html>
<meta charset="utf-8">
<title>CTA banner - restore the pool</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px 32px; background: linear-gradient(180deg, #FBF0DF 0%, #F4E4CB 100%); display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: center; }
  .text { display: flex; flex-direction: column; gap: 6px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--ember); display: flex; align-items: center; gap: 10px; }
  .eyebrow::before { content: ""; width: 26px; height: 1px; background: currentColor; }
  h2 { font-family: "Plus Jakarta Sans"; font-size: 30px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin: 0; color: var(--ink); }
  p { font-size: 14px; color: var(--ink-soft); margin: 0; max-width: 460px; }
  .stack { display: flex; gap: 10px; align-items: stretch; }
  .btn {
    font-family: "Plus Jakarta Sans";
    font-weight: 600;
    font-size: 15px;
    padding: 13px 24px;
    border-radius: 6px;
    border: 0;
    cursor: pointer;
    line-height: 1;
    transition: transform 90ms ease-out, box-shadow 90ms ease-out, background 160ms;
    display: inline-flex;
    align-items: center;
  }
  .btn:active { transform: translateY(3px); }
  .btn-p {
    background: var(--ember);
    color: #fff;
    box-shadow: 0 3px 0 0 #6E2106, inset 0 1px 0 0 rgba(255,255,255,0.2);
  }
  .btn-p:hover { background: #C04823; }
  .btn-p:active { box-shadow: 0 0 0 0 #6E2106, inset 0 1px 0 0 rgba(255,255,255,0.12); }
  .btn-s {
    background: transparent;
    color: var(--ink);
    box-shadow: inset 0 0 0 2px var(--ink), 0 3px 0 -1px var(--ink);
  }
  .btn-s:hover { background: rgba(40,35,32,0.06); }
  .btn-s:active { box-shadow: inset 0 0 0 2px var(--ink), 0 0 0 -1px var(--ink); }
</style>
<div class="card">
  <div class="text">
    <div class="eyebrow">Help us</div>
    <h2>The pool is closed for now.<br>Help us bring it back.</h2>
    <p>Every pound, every signature, every volunteer hour gets us closer. The community built it once - we'll build it again.</p>
  </div>
  <div class="stack">
    <button class="btn btn-p">Donate</button>
    <button class="btn btn-s">Read the plan</button>
  </div>
</div>
