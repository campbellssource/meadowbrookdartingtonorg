<!doctype html>
<meta charset="utf-8">
<title>Hero pattern</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 0; position: relative; height: 320px; overflow: hidden; }
  .photo { position: absolute; inset: 0; background: url('../assets/photos/hero.webp') center/cover; }
  .photo::after { content:""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(40,35,32,0) 30%, rgba(40,35,32,0.55) 100%); }
  .copy { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 28px 36px; color: #fff; }
  .eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; opacity: 0.92; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
  .eyebrow::before { content:""; width: 30px; height: 1px; background: currentColor; opacity: 0.7; }
  h1 { font-family: "Plus Jakarta Sans"; font-weight: 700; font-size: 48px; line-height: 1.0; letter-spacing: -0.02em; margin: 0; max-width: 540px; }
  .row { display: flex; gap: 10px; margin-top: 18px; }
  .btn { font-family: "Plus Jakarta Sans"; font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 999px; border: 0; }
  .btn-p { background: var(--sun); color: var(--ink); }
  .btn-g { background: transparent; color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.5); }
</style>
<div class="card">
  <div class="photo"></div>
  <div class="copy">
    <div class="eyebrow">Saturday extravaganza · Meadowbrook</div>
    <h1>Come as you are. Stay too late.</h1>
    <div class="row">
      <button class="btn btn-p">What's on</button>
      <button class="btn btn-g">Find us</button>
    </div>
  </div>
</div>
