<!doctype html>
<meta charset="utf-8">
<title>Core palette — canvas</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px 28px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  .head h3 { font-size: 14px; font-weight: 600; margin: 0; color: var(--ink); }
  .head .sub { font-size: 11px; color: var(--ink-mute); letter-spacing: 0.05em; text-transform: uppercase; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sw { border-radius: var(--r-md); padding: 14px; height: 110px; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; }
  .sw .name { font-size: 12px; font-weight: 600; }
  .sw .hex { font-family: ui-monospace, monospace; font-size: 11px; opacity: 0.7; }
  .sw.bord { box-shadow: inset 0 0 0 1px rgba(40, 35, 32, 0.08); }
</style>
<div class="card">
  <div class="head">
    <h3>Core canvas — warm, papery, natural</h3>
    <span class="sub">The base every zone sits on</span>
  </div>
  <div class="row">
    <div class="sw" style="background:#FBF0DF; color:#28201A"><span class="name">Paper</span><span class="hex">#FBF0DF</span></div>
    <div class="sw" style="background:#F4E4CB; color:#28201A"><span class="name">Paper deep</span><span class="hex">#F4E4CB</span></div>
    <div class="sw" style="background:#D1B08B; color:#28201A"><span class="name">Sand</span><span class="hex">#D1B08B</span></div>
    <div class="sw bord" style="background:#FFFFFF; color:#28201A"><span class="name">Bone</span><span class="hex">#FFFFFF</span></div>
  </div>
</div>
