<!doctype html>
<meta charset="utf-8">
<title>Type - zone display fonts (1/2)</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 28px; }
  .head { font-size: 11px; color: var(--ink-mute); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 14px; }
  .row { display: grid; grid-template-columns: 100px 1fr 90px; gap: 18px; align-items: baseline; padding: 8px 0; }
  .lab { font-size: 11px; color: var(--ink-mute); letter-spacing: 0.04em; text-transform: uppercase; }
  .meta { font-family: ui-monospace, monospace; font-size: 10px; color: var(--ink-mute); text-align: right; }
  .specimen { color: var(--ink); font-size: 38px; line-height: 1; }
  .extravaganza { font-family: "Abril Fatface", serif; }
  .bike { font-family: "Bebas Neue", sans-serif; letter-spacing: 0.01em; }
  .fields { font-family: "Oswald", sans-serif; font-weight: 700; text-transform: uppercase; font-size: 32px; }
  .dra { font-family: "Lobster", cursive; }
</style>
<div class="card">
  <div class="head">Zone display fonts - pt 1</div>
  <div class="row"><span class="lab">Events</span><span class="specimen extravaganza">Extravaganza</span><span class="meta">Abril Fatface</span></div>
  <div class="row"><span class="lab">Bike Track</span><span class="specimen bike">Send it sideways</span><span class="meta">Bebas Neue</span></div>
  <div class="row"><span class="lab">Fields</span><span class="specimen fields">Sunday League</span><span class="meta">Oswald 700</span></div>
  <div class="row"><span class="lab">The DRA</span><span class="specimen dra">the DRA</span><span class="meta">Lobster</span></div>
</div>
