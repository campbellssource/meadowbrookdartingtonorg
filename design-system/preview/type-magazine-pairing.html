<!doctype html>
<meta charset="utf-8">
<title>Magazine pairing</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 26px 32px; background: #FBF0DF; }
  .eyebrow { font-family: "Plus Jakarta Sans"; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--green-dark); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  .eyebrow::before { content:""; width: 26px; height: 1px; background: currentColor; }
  h1 { font-family: "Plus Jakarta Sans"; font-weight: 700; font-size: 48px; line-height: 1.02; letter-spacing: -0.02em; color: var(--ink); margin: 0 0 14px; max-width: 600px; }
  p { font-size: 14px; color: var(--ink-soft); line-height: 1.55; max-width: 480px; margin: 0; }
  .note { margin-top: 16px; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-mute); }
</style>
<div class="card">
  <div class="eyebrow">Saturday, 24 June · Meadowbrook</div>
  <h1>Summer extravaganza is back.</h1>
  <p>One day of music, food, dancing, and our annual dunk-the-trustee booth. Bring family, bring a blanket, bring everyone.</p>
  <div class="note">Pairing — label eyebrow + display headline + body</div>
</div>
