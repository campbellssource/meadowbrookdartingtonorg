name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: meadowbrookdartington
  REGION: europe-west2
  SERVICE: meadowbrook-site
  IMAGE: europe-west2-docker.pkg.dev/meadowbrookdartington/meadowbrook/site

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/589136616970/locations/global/workloadIdentityPools/github-actions/providers/github-provider
          service_account: github-actions-deploy@meadowbrookdartington.iam.gserviceaccount.com

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      # Deliberately NOT set here:
      #   BOOKING_EMAIL_TRANSPORT   production refuses "console" and defaults to
      #                             brevo, so setting it can only do harm
      #   BOOKING_ADMIN_DEV_LOGIN   refused when NODE_ENV=production regardless
      #   BOOKING_CRON_ALLOW_SECRET the shared-secret cron fallback stays off in
      #                             production; Cloud Scheduler uses OIDC
      #
      # BOOKING_IMPERSONATE_SA *is* required here. It reads like a local
      # convenience and is not: the Cloud Run runtime service account has no roles
      # on meadowbrook-booking, and the room calendars are shared with booking-app
      # rather than with it. Unset means every booking read fails. See spec 08.
      #
      # The ^|^ prefix switches gcloud's delimiter to | so values containing
      # commas (the admin allowlist) survive.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --update-env-vars="^|^PUBLIC_KEYSTATIC_GITHUB_APP_SLUG=meadowbrook-keystatic|PUBLIC_SQUARE_APPLICATION_ID=sq0idp-SJPH8U9hBP8q9dM97RSZmA|PUBLIC_SQUARE_LOCATION_ID=LT08J54D3THKE|PUBLIC_SQUARE_ENVIRONMENT=production|BREVO_LEAFLET_LIST_ID=3|LEAFLET_SHEET_ID=18QilZ2jGCf3W-DzV5zWKvYs5k3yeVLQB455nnCHNVak|BOOKING_PROJECT_ID=meadowbrook-booking|BOOKING_IMPERSONATE_SA=booking-app@meadowbrook-booking.iam.gserviceaccount.com|BOOKING_NOTIFY_OWNER=true|BOOKING_ADMIN_EMAILS=${{ vars.BOOKING_ADMIN_EMAILS }}|BOOKING_ADMIN_OAUTH_CLIENT_ID=${{ vars.BOOKING_ADMIN_OAUTH_CLIENT_ID }}|BOOKING_SQUARE_WEBHOOK_URL=https://meadowbrookdartington.org/api/booking/webhooks/square|PUBLIC_BOOKING_SQUARE_ENVIRONMENT=${{ vars.PUBLIC_BOOKING_SQUARE_ENVIRONMENT }}|PUBLIC_BOOKING_SQUARE_APPLICATION_ID=${{ vars.PUBLIC_BOOKING_SQUARE_APPLICATION_ID }}|PUBLIC_BOOKING_SQUARE_LOCATION_ID=${{ vars.PUBLIC_BOOKING_SQUARE_LOCATION_ID }}" \
            --update-secrets="SQUARE_ACCESS_TOKEN=SQUARE_ACCESS_TOKEN:latest,BREVO_API_KEY=BREVO_API_KEY:latest,BOOKING_MAGIC_LINK_SECRET=BOOKING_MAGIC_LINK_SECRET:latest,BOOKING_CRON_SECRET=BOOKING_CRON_SECRET:latest,BOOKING_SQUARE_ACCESS_TOKEN=BOOKING_SQUARE_ACCESS_TOKEN:latest,BOOKING_SQUARE_WEBHOOK_SIGNATURE_KEY=BOOKING_SQUARE_WEBHOOK_SIGNATURE_KEY:latest,BOOKING_ADMIN_OAUTH_CLIENT_SECRET=BOOKING_ADMIN_OAUTH_CLIENT_SECRET:latest" \
            --quiet
