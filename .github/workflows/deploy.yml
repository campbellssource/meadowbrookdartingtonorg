name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: meadowbrookdartington
  REGION: europe-west2
  SERVICE: meadowbrook-site
  IMAGE: europe-west2-docker.pkg.dev/meadowbrookdartington/meadowbrook/site

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/589136616970/locations/global/workloadIdentityPools/github-actions/providers/github-provider
          service_account: github-actions-deploy@meadowbrookdartington.iam.gserviceaccount.com

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --update-env-vars="PUBLIC_KEYSTATIC_GITHUB_APP_SLUG=meadowbrook-keystatic,PUBLIC_SQUARE_APPLICATION_ID=sq0idp-SJPH8U9hBP8q9dM97RSZmA,PUBLIC_SQUARE_LOCATION_ID=LT08J54D3THKE,PUBLIC_SQUARE_ENVIRONMENT=production" \
            --update-secrets="SQUARE_ACCESS_TOKEN=SQUARE_ACCESS_TOKEN:latest" \
            --quiet
