name: PR preview

# Deploys each open pull request to its own URL on a separate Cloud Run service,
# meadowbrook-site-preview, as a tagged revision that takes no traffic:
#
#   https://pr-<number>---meadowbrook-site-preview-<hash>.europe-west2.run.app
#
# The URL is posted as a comment on the PR and updated on every push. When the
# PR closes, the tag and that PR's revisions are removed.
#
# Previews are for checking content and layout. They carry none of production's
# config: no production Square, no Brevo, no booking service account. Booking,
# sign-ups and the Keystatic editor don't work there, and emails never send --
# a preview must never be able to take a real payment or email a real person.
# The service runs as its own service account, site-preview-runtime.
#
# The exception is /donate, which works end to end in the Square SANDBOX
# (spec/gift-aid/01, "PR previews"), against test-only stores:
#   - SQUARE_ACCESS_TOKEN comes from PREVIEW_SQUARE_ACCESS_TOKEN, a sandbox token.
#     Sandbox cannot move real money.
#   - Firestore is the separate "preview" database in meadowbrook-booking.
#     site-preview-runtime is granted that database only, by an IAM condition;
#     it cannot read or write the production (default) database.
#   - Gift Aid rows go to a test copy of the sheet, shared with
#     site-preview-runtime and nothing else of the bookkeeper's.
#   - Each PR gets its own Square sandbox webhook subscription at its tag URL,
#     created here on every deploy and deleted when the PR closes. Its signature
#     key is a sandbox key, passed as a masked env var on that PR's revision.
#
# Security, since the repo is public:
#   - Uses `pull_request`, never `pull_request_target`, so PR code never runs
#     with this repo's privileges by accident.
#   - PRs from forks are skipped (they get no OIDC token anyway).
#   - Deploys as github-preview-deploy, which can only touch the preview service
#     and the meadowbrook-previews image repository -- not production.
#
# One-off GCP setup for all of this lives in scripts/setup-pr-previews.sh.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  PROJECT_ID: meadowbrookdartington
  REGION: europe-west2
  SERVICE: meadowbrook-site-preview
  IMAGE: europe-west2-docker.pkg.dev/meadowbrookdartington/meadowbrook-previews/site
  RUNTIME_SA: site-preview-runtime@meadowbrookdartington.iam.gserviceaccount.com
  TAG: pr-${{ github.event.pull_request.number }}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/589136616970/locations/global/workloadIdentityPools/github-actions/providers/github-provider
          service_account: github-preview-deploy@meadowbrookdartington.iam.gserviceaccount.com

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build --build-arg SITE_PREVIEW=true -t ${{ env.IMAGE }}:${{ env.TAG }}-${{ github.event.pull_request.head.sha }} .
          docker push ${{ env.IMAGE }}:${{ env.TAG }}-${{ github.event.pull_request.head.sha }}

      # The tag URL is fixed per PR (pr-N---<service host>), so it is known before
      # deploying and the sandbox webhook can point at it.
      - name: Sandbox webhook for this PR
        id: hook
        run: |
          BASE=$(gcloud run services describe ${{ env.SERVICE }} --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} --format='value(status.url)')
          URL="https://${{ env.TAG }}---${BASE#https://}/api/donate/webhooks/square"
          TOKEN=$(gcloud secrets versions access latest --secret=PREVIEW_SQUARE_ACCESS_TOKEN --project=${{ env.PROJECT_ID }})
          echo "::add-mask::$TOKEN"
          SQ=https://connect.squareupsandbox.com/v2/webhooks/subscriptions
          H=(-H "Authorization: Bearer $TOKEN" -H "Square-Version: 2025-01-23" -H "Content-Type: application/json")
          # Replace rather than reuse: a fresh subscription is the reliable way to
          # get its signature key back.
          for ID in $(curl -sf "${H[@]}" "$SQ" | jq -r --arg u "$URL" '.subscriptions[]? | select(.notification_url == $u) | .id'); do
            curl -sf -X DELETE "${H[@]}" "$SQ/$ID" > /dev/null
          done
          # The webhooks API refuses the 2024-01-17 version the payment code pins,
          # so subscriptions use a current one. The event payload fields the
          # handler reads (data.object.payment.id / refund.id) are the same.
          RESP=$(curl -s -X POST "${H[@]}" "$SQ" -d "$(jq -n --arg u "$URL" --arg k "${{ env.TAG }}-$(uuidgen)" '{
            idempotency_key: $k,
            subscription: { name: "Meadowbrook preview ${{ env.TAG }}", notification_url: $u, api_version: "2025-01-23",
              event_types: ["payment.created","payment.updated","refund.created","refund.updated"] } }')")
          KEY=$(jq -r '.subscription.signature_key // empty' <<< "$RESP")
          if [ -z "$KEY" ]; then
            echo "Could not create the sandbox webhook subscription:"; jq -c '.errors' <<< "$RESP"; exit 1
          fi
          echo "::add-mask::$KEY"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      # --no-traffic + --tag gives this revision its own URL without moving the
      # service's main URL. The revision suffix lets the close job find this PR's
      # revisions again.
      - name: Deploy tagged revision
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.IMAGE }}:${{ env.TAG }}-${{ github.event.pull_request.head.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --service-account=${{ env.RUNTIME_SA }} \
            --revision-suffix=${{ env.TAG }}-$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7)-${{ github.run_attempt }} \
            --no-traffic \
            --tag=${{ env.TAG }} \
            --update-env-vars="^|^PUBLIC_SQUARE_ENVIRONMENT=sandbox|PUBLIC_SQUARE_APPLICATION_ID=sandbox-sq0idb-u2sbtq_SEsLGWHObEJwDgg|PUBLIC_SQUARE_LOCATION_ID=LQA9JF8KM41F2|BOOKING_PROJECT_ID=meadowbrook-booking|BOOKING_FIRESTORE_DATABASE=preview|GIFT_AID_SHEET_ID=10r2WxQTAPvy7zXNRN-9wdGQR3kGXcTAod5ba4A9E5Ng|DONATE_SQUARE_WEBHOOK_URL=${{ steps.hook.outputs.url }}|DONATE_SQUARE_WEBHOOK_SIGNATURE_KEY=${{ steps.hook.outputs.key }}" \
            --update-secrets=SQUARE_ACCESS_TOKEN=PREVIEW_SQUARE_ACCESS_TOKEN:latest \
            --quiet

      - name: Find preview URL
        id: url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --format=json | jq -r '.status.traffic[] | select(.tag == "${{ env.TAG }}") | .url')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.url.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          MARKER='<!-- pr-preview -->'
          BODY="$MARKER
          **Preview:** $URL

          Built from \`${SHA:0:7}\`. Donations run in the Square sandbox (test card 4111 1111 1111 1111) and record to the preview database and the TEST copy of the Gift Aid sheet. Bookings, sign-ups and emails are switched off here."
          ID=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ID" -f body="$BODY" > /dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/$PR/comments" -f body="$BODY" > /dev/null
          fi

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/589136616970/locations/global/workloadIdentityPools/github-actions/providers/github-provider
          service_account: github-preview-deploy@meadowbrookdartington.iam.gserviceaccount.com

      - name: Remove this PR's sandbox webhook
        run: |
          BASE=$(gcloud run services describe ${{ env.SERVICE }} --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} --format='value(status.url)')
          URL="https://${{ env.TAG }}---${BASE#https://}/api/donate/webhooks/square"
          TOKEN=$(gcloud secrets versions access latest --secret=PREVIEW_SQUARE_ACCESS_TOKEN --project=${{ env.PROJECT_ID }})
          echo "::add-mask::$TOKEN"
          SQ=https://connect.squareupsandbox.com/v2/webhooks/subscriptions
          H=(-H "Authorization: Bearer $TOKEN" -H "Square-Version: 2025-01-23")
          for ID in $(curl -sf "${H[@]}" "$SQ" | jq -r --arg u "$URL" '.subscriptions[]? | select(.notification_url == $u) | .id'); do
            curl -sf -X DELETE "${H[@]}" "$SQ/$ID" > /dev/null || true
          done

      - name: Remove preview tag
        run: |
          gcloud run services update-traffic ${{ env.SERVICE }} \
            --remove-tags=${{ env.TAG }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} --quiet || true

      # Sweeps every revision that no tag or traffic points at, not just this
      # PR's: Cloud Run refuses to delete the latest-created revision, so a PR
      # closed while it was newest leaves one behind for the next close to clear.
      # This also clears open PRs' revisions superseded by later pushes.
      #
      # Images are cleaned up by the meadowbrook-previews repository's cleanup
      # policy, not here.
      - name: Delete unused revisions
        run: |
          IN_USE=$(gcloud run services describe ${{ env.SERVICE }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --format=json | jq -r '.status.traffic[].revisionName')
          for REV in $(gcloud run revisions list --service=${{ env.SERVICE }} \
              --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
              --format='value(metadata.name)'); do
            if grep -qx "$REV" <<< "$IN_USE"; then continue; fi
            gcloud run revisions delete "$REV" \
              --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} --quiet || true
          done
